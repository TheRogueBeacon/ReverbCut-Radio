<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ReverbCut Radio // Live</title>

  <!-- Meta -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Enjoy the cinematic pool shaping the vibes of future games, videos, and films." />

  <!-- OG / Social Shadow -->
  <meta property="og:title" content="ReverbCut Radio" />
  <meta property="og:description" content="Enjoy the cinematic pool shaping the vibes of future games, videos, and films." />
  <meta property="og:image" content="https://reverbcut.com/og/reverbcut-radio.png" />
  <meta property="og:type" content="website" />

  <!-- Styles + Favicon -->
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="assets/favicon.ico">
</head>


  <style>
    :root {
      --bg: #05030a;
      --purple: #a855ff;
      --purple-soft: rgba(168, 85, 255, 0.25);
      --text-main: #f5f3ff;
      --text-soft: #a1a1aa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at top, #12051f 0, var(--bg) 55%);
      color: var(--text-main);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .shell {
      position: relative;
      width: 100%;
      max-width: 960px;
      padding: 32px 24px;
      text-align: center;
    }

    .glow-ring {
      position: absolute;
      inset: 10%;
      border-radius: 32px;
      background: radial-gradient(circle at top, var(--purple-soft), transparent 60%);
      opacity: 0.25;
      filter: blur(40px);
      pointer-events: none;
      z-index: 0;
    }

    .frame {
      position: relative;
      border-radius: 24px;
      border: 1px solid rgba(148, 163, 184, 0.25);
      background: radial-gradient(circle at top, rgba(15, 23, 42, 0.9), rgba(3, 7, 18, 0.98));
      padding: 40px 24px 32px;
      box-shadow: 0 0 60px rgba(15, 23, 42, 0.9);
      z-index: 1;
    }

    .label {
      font-size: 0.75rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-soft);
      margin-bottom: 12px;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 500;
      margin-bottom: 10px;
    }

    .tagline {
      font-size: 0.95rem;
      color: var(--text-soft);
      margin-bottom: 32px;
    }

    .eq-shell {
      position: relative;
      width: 100%;
      height: 120px;
      margin: 0 auto 28px;
      overflow: hidden;
    }

    #eqCanvas {
      width: 100%;
      height: 100%;
      display: block;
      filter: blur(1px);
      opacity: 0.08;
      transition: opacity 0.6s ease;
    }

    .eq-active #eqCanvas {
      opacity: 0.16;
    }

    .progress {
      position: relative;
      width: 100%;
      height: 2px;
      background: rgba(148, 163, 184, 0.15);
      overflow: hidden;
      border-radius: 999px;
      margin-bottom: 28px;
    }

    .progress-bar {
      position: absolute;
      inset: 0;
      width: 0%;
      background: linear-gradient(90deg, rgba(168, 85, 255, 0.2), rgba(168, 85, 255, 0.9));
      opacity: 0.12;
      transition: width 0.1s linear;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 22px;
      border-radius: 999px;
      border: 1px solid rgba(168, 85, 255, 0.7);
      background: radial-gradient(circle at top, rgba(168, 85, 255, 0.18), rgba(15, 23, 42, 0.95));
      color: var(--text-main);
      font-size: 0.9rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: box-shadow 0.25s ease, transform 0.25s ease, border-color 0.25s ease, background 0.25s ease;
    }

    .cta:hover {
      box-shadow: 0 0 30px rgba(168, 85, 255, 0.45);
      transform: translateY(-1px);
      border-color: rgba(244, 244, 245, 0.9);
    }

    .cta-pulse {
      animation: pulse 0.6s ease-out 1;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(168, 85, 255, 0.7); }
      100% { box-shadow: 0 0 0 40px rgba(168, 85, 255, 0); }
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 24px;
      font-size: 0.7rem;
      color: var(--text-soft);
      opacity: 0.7;
    }

    .meta-row span {
      white-space: nowrap;
    }

    .meta-row .right {
      text-align: right;
    }

    .signal-interrupt {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, rgba(15, 23, 42, 0.9), rgba(3, 7, 18, 0.98));
      color: var(--text-soft);
      font-size: 0.75rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .signal-interrupt.visible {
      opacity: 1;
    }

    .signal-interrupt span {
      border-top: 1px solid rgba(148, 163, 184, 0.3);
      border-bottom: 1px solid rgba(148, 163, 184, 0.3);
      padding: 8px 16px;
    }

    .ghost-line {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(148, 163, 184, 0.4), transparent);
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .signal-interrupt.visible + .ghost-line {
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="grid-bg"></div>

  <div class="shell">
    <div class="glow-ring"></div>

    <div class="frame" id="frame">

      <!-- Station Identity -->
      <div class="label">ReverbCut Radio // Live</div>
      <p class="tagline">
        Enjoy the cinematic pool shaping the vibes of future games, videos, and films.
      </p>

      <!-- Hero Title -->
      <h1 class="hero-title">JUST LET IT RUN</h1>

      <!-- EQ Box -->
      <div class="eq-shell" id="eqShell">
        <canvas id="eqCanvas"></canvas>
        <canvas id="eq-visualizer"></canvas>

        <div class="signal-interrupt" id="signalInterrupt">
          <span>SIGNAL INTERRUPTED // RECONNECTING...</span>
        </div>

        <div class="ghost-line"></div>
      </div>

      <!-- Initialize the Signal -->
      <p class="hero-subtitle">Initialize the Signal</p>

      <!-- Button -->
      <button class="cta" id="imaginationBtn">
        Use Your Imagination
      </button>

      <!-- Meta Row -->
      <div class="meta-row">
        <span id="signalTrace">SIG // 0x0000</span>
        <span id="listenerGhost" class="right">1</span>
      </div>

    </div>
  </div>

  <!-- Audio -->
  <audio id="audio" preload="auto" crossorigin="anonymous" playsinline>
    <source src="https://groundzero.elcodexlabs.com/stream/live.mp3" type="audio/mpeg" />
  </audio>

  <!-- JS stays the same except for adding heroEQ -->
  <script>
    const heroEQ = document.getElementById('eq-visualizer');
    /* everything else stays the same */
  </script>
</body>
</html>
